limit_req_zone $binary_remote_addr zone=demi_store:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=demi_publish:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name demiengine.de;
    root /srv/demi-store/current/public;
    index index.php;
    client_max_body_size 1m;
    server_tokens off;

    location / {
        limit_req zone=demi_store burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/api/publishing/(releases|listings)$ {
        auth_request /_publishing_auth;
        limit_req zone=demi_publish burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 600m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/demi-store.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param APP_ENV prod;
        fastcgi_param DEMI_STORE_DATA /var/lib/demi-store/catalog;
        fastcgi_read_timeout 180;
    }

    location = /_publishing_auth {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/demi-store.sock;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param REQUEST_METHOD POST;
        fastcgi_param REQUEST_URI /api/publishing/check;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/demi-store.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param APP_ENV prod;
        fastcgi_param DEMI_STORE_DATA /var/lib/demi-store/catalog;
        fastcgi_read_timeout 60;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(css|js|svg)$ {
        expires 1h;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    access_log /var/log/nginx/demi-store.access.log;
    error_log /var/log/nginx/demi-store.error.log;
}
