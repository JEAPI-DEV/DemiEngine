[demi-store]
user = www-data
group = www-data
listen = /run/php/demi-store.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500
env[APP_ENV] = prod
env[DEMI_STORE_DATA] = /var/lib/demi-store/catalog
env[DEMI_PUBLISH_KEY_FILE] = /etc/demi-store/publish-token.sha256
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 600M
php_admin_value[max_execution_time] = 180
php_admin_value[max_input_time] = 180
php_admin_value[memory_limit] = 192M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
